# RIBAS - DEV environment (runs on each developer's laptop)
#
#   make infra   -> postgres + kafka + redis only (run your service from the IDE)
#   make up      -> full stack (infra + 7 services + kong + frontend)
#
# Notes
#  - No profile  = infra, always started by `docker compose up`.
#  - profile core = gateway, frontend and the 7 services.
#  - profile tools = optional debugging UIs (Kafka UI).
#  - No observability here: Grafana / VictoriaMetrics / Loki exist only in QA and Prod.
#  - image + build are both set so the same image names are reused by the QA/Prod Swarm stacks.

name: ribas

networks:
  ribas: {}

volumes:
  pgdata: {}

# ---------- shared blocks ----------
x-spring: &spring
  restart: unless-stopped
  networks: [ribas]
  mem_limit: 512m
  profiles: [core]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 10
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: dev
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: "-Xmx256m"

services:
  # =====================================================
  # INFRASTRUCTURE
  # =====================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]            # DBeaver / IDE access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ribas]

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # INTERNO: contenedores usan: kafka:9092 | EXTERNO: servicios corren desde el IDE usar localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topicos son creados solo por kafka-init
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 15
    networks: [ribas]

  # One-shot job: creates one topic per producing service, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in identidad donadores inventario solicitudes campanias externo; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t.events" \
            --partitions 1 --replication-factor 1
        done
    networks: [ribas]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ribas]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    profiles: [tools]
    networks: [ribas]

  # =====================================================
  # GATEWAY + FRONTEND
  # =====================================================
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports: ["127.0.0.1:8000:8000"]
    networks: [ribas]
    profiles: [core]

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:3000:80"]
    networks: [ribas]
    profiles: [core]

  # =====================================================
  # SERVICES (7)
  # =====================================================

  # 1. Identidad y Acceso (+ Gestion Institucional)  -  .NET
  identidad:
    image: ghcr.io/samt81/vitalis-identidad:${TAG:-dev}
    build: ./services/identidad
    restart: unless-stopped
    networks: [ribas]
    mem_limit: 512m
    profiles: [core]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=identidad_db;Username=identidad_user;Password=${DEV_DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # 2. Donantes y Donaciones  -  Spring Boot
  donadores:
    <<: *spring
    image: ghcr.io/samt81/vitalis-donadores:${TAG:-dev}
    build: ./services/donadores
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/donadores_db
      SPRING_DATASOURCE_USERNAME: donadores_user
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}

  # 3. Inventario Sanguineo  -  Spring Boot (+ Redis cache)
  inventario:
    <<: *spring
    image: ghcr.io/samt81/vitalis-inventario:${TAG:-dev}
    build: ./services/inventario
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventario_db
      SPRING_DATASOURCE_USERNAME: inventario_user
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 4. Solicitudes y Transferencias  -  Spring Boot
  #    Only synchronous call in the system: asks Inventario for availability (REST via gateway + Resilience4j).
  solicitudes:
    <<: *spring
    image: ghcr.io/samt81/vitalis-solicitudes:${TAG:-dev}
    build: ./services/solicitudes
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/solicitudes_db
      SPRING_DATASOURCE_USERNAME: solicitudes_user
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      INVENTORY_BASE_URL: http://kong:8000

  # 5. Campanias  -  Spring Boot
  campanias:
    <<: *spring
    image: ghcr.io/samt81/vitalis-campanias:${TAG:-dev}
    build: ./services/campanias
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campanias_db
      SPRING_DATASOURCE_USERNAME: campanias_user
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}

  # 6. Auditoria + Reportes  -  Spring Boot (consumes every *.events topic)
  auditoria-reportes:
    <<: *spring
    image: ghcr.io/samt81/vitalis-auditoria-reportes:${TAG:-dev}
    build: ./services/auditoria-reportes
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auditoria_reportes_db
      SPRING_DATASOURCE_USERNAME: auditoria_reportes_user
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}

  # 7. Servicios Externos (integration + notifications)  -  Spring Boot, no database, stub mode in DEV
  externo:
    <<: *spring
    image: ghcr.io/samt81/vitalis-externo:${TAG:-dev}
    build: ./services/externo
    environment:
      <<: *spring-env
      SPRING_PROFILES_ACTIVE: dev,stub
    depends_on:
      kafka-init:
        condition: service_completed_successfully