# nginx para la SPA de Vitalis (React Router): contenido estático con fallback a index.html.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cabeceras de seguridad básicas. nginx no hereda add_header cuando un location define
  # los suyos, por eso se repiten en cada bloque.
  # connect-src queda abierto porque la URL de Kong se fija al construir la imagen.

  # Assets con hash en el nombre (los genera Vite): caché larga e inmutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Comprobación de salud para Docker Swarm.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Cualquier otra ruta (/login, /cuenta…) la resuelve React Router: se sirve index.html
  # sin caché para que un despliegue nuevo se vea de inmediato.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
