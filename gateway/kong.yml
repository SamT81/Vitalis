_format_version: "3.0"
services:
  - name: identidad
    url: http://identidad:8080
    routes:
      - { name: identidad, strip_path: false, paths: ["/api/v1/auth", "/api/v1/usuarios", "/api/v1/instituciones"] }
  - name: donadores
    url: http://donadores:8080
    routes:
      - { name: donadores, strip_path: false, paths: ["/api/v1/donadores", "/api/v1/donaciones"] }
  - name: inventario
    url: http://inventario:8080
    routes:
      - { name: inventario, strip_path: false, paths: ["/api/v1/inventario"] }
  - name: solicitudes
    url: http://solicitudes:8080
    routes:
      - { name: solicitudes, strip_path: false, paths: ["/api/v1/traslados"] }
  - name: campanias
    url: http://campanias:8080
    routes:
      - { name: campanias, strip_path: false, paths: ["/api/v1/campanias"] }
  - name: auditoria-reportes
    url: http://auditoria-reportes:8080
    routes:
      - { name: auditoria-reportes, strip_path: false, paths: ["/api/v1/audit", "/api/v1/reportes"] }
  - name: externo
    url: http://externo:8080
    routes:
      - { name: externo, strip_path: false, paths: ["/api/v1/integracion"] }
plugins:
  - name: cors
    config:
      origins: ["http://localhost:3000"]
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type]