# Levanta la web de producción en local:  docker compose up --build   →  http://localhost:5173
#
# Para apuntar al backend, define las variables antes de construir:
#   VITE_USE_MOCK=false VITE_API_BASE_URL=http://localhost:8000 docker compose up --build
services:
  web:
    image: vitalis-web:local
    build:
      context: .
      dockerfile: frontend-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    ports:
      - '5173:80'
    restart: unless-stopped
